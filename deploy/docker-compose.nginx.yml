# =============================================================================
# Sub2API — Nginx Reverse Proxy + Let's Encrypt HTTPS (overlay)
# =============================================================================
# This is an ADD-ON compose file. Layer it on top of a base compose file so
# that nginx (80/443) fronts the Sub2API app over the shared internal network:
#
#   docker compose -f docker-compose.local.yml -f docker-compose.nginx.yml up -d
#
# First-time HTTPS bootstrap (issues the certificate, then brings everything up):
#
#   # set DOMAIN and CERTBOT_EMAIL in .env first, or pass them inline:
#   DOMAIN=api.example.com CERTBOT_EMAIL=you@example.com ./nginx/init-letsencrypt.sh
#
# Requirements:
#   - A domain (DOMAIN) whose DNS A/AAAA record points at THIS server
#   - Ports 80 and 443 reachable from the public internet (for the ACME challenge)
#
# Tip: once nginx fronts the app, you usually do NOT want to also expose the raw
# app port. In your .env set  BIND_HOST=127.0.0.1  so 8080 stays local-only.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx reverse proxy (TLS termination, HTTP->HTTPS redirect, SSE streaming)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.30.4-alpine
    container_name: sub2api-nginx
    restart: unless-stopped
    depends_on:
      - sub2api
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ${DOMAIN} is substituted into templates/*.template at startup.
      - DOMAIN=${DOMAIN:?DOMAIN is required, e.g. DOMAIN=api.example.com}
      # Restrict envsubst to DOMAIN only, so nginx's own $host/$remote_addr/etc.
      # are NOT mangled during template rendering.
      - NGINX_ENVSUBST_FILTER=DOMAIN
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
      - nginx-logs:/var/log/nginx
    networks:
      - sub2api-network
    # 1) Drop the image's default welcome server.
    # 2) Reload every 6h so renewed certificates are picked up without downtime.
    command: >
      /bin/sh -c 'rm -f /etc/nginx/conf.d/default.conf;
                  while :; do sleep 6h & wait $${!}; nginx -s reload; done &
                  nginx -g "daemon off;"'

  # ---------------------------------------------------------------------------
  # Certbot — obtains and auto-renews the Let's Encrypt certificate
  # ---------------------------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: sub2api-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Attempt renewal twice a day; certbot only renews when near expiry.
    # (Initial issuance is done by nginx/init-letsencrypt.sh.)
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
                  while :; do
                    certbot renew --webroot -w /var/www/certbot --quiet;
                    sleep 12h & wait $${!};
                  done'

# =============================================================================
# Named volumes shared between nginx and certbot
# =============================================================================
volumes:
  certbot-etc:   # /etc/letsencrypt — certificates, keys, renewal config
  certbot-www:   # /var/www/certbot — ACME HTTP-01 challenge webroot
  nginx-logs:    # /var/log/nginx

# =============================================================================
# Network — merged with the base compose file's sub2api-network by name
# =============================================================================
networks:
  sub2api-network:
    driver: bridge
